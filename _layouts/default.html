<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light"><meta name="theme-color" content="#10243c">
  <meta name="google-site-verification" content="o5L7XSaaQ47cSW0MYdBlAvXkc1hf6uQMmIffhdxhEzU"><meta name="msvalidate.01" content="72D1368100F04E271E3EC2CC04D06B2D">
  <title>{{ page.title | default: site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
  {% if page.robots %}<meta name="robots" content="{{ page.robots }}">{% endif %}
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:type" content="{{ page.og_type | default: 'article' }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title | escape }}">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:image" content="{{ page.og_image | default: '/assets/images/og-cover.png' | absolute_url }}">
  <meta name="twitter:card" content="summary">
  <script type="application/ld+json">{
    "@context":"https://schema.org",
    "@type":{{ page.schema_type | default: 'WebPage' | jsonify }},
    "name":{{ page.title | default: site.title | jsonify }},
    {% if page.schema_type == 'Article' %}"headline":{{ page.heading | default: page.title | jsonify }},"author":{"@type":"Organization","name":{{ site.title | jsonify }}}{% if page.date_published %},"datePublished":{{ page.date_published | jsonify }}{% endif %},{% endif %}
    "description":{{ page.description | default: site.description | jsonify }},
    "url":{{ page.url | absolute_url | jsonify }},
    "inLanguage":"zh-CN",
    "dateModified":{{ page.date_modified | default: '2026-11-10' | jsonify }},
    "isPartOf":{"@type":"WebSite","name":{{ site.title | jsonify }},"url":{{ '/' | absolute_url | jsonify }}}
    {% if page.schema_type == 'Article' %},"mainEntityOfPage":{"@type":"WebPage","@id":{{ page.url | absolute_url | jsonify }}}{% endif %}
  }</script>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-D2NJELDR3X"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-D2NJELDR3X');</script>
</head><body>
<a class="skip-link" href="#main-content">跳转到正文</a>
<header class="site-header"><div class="header-inner">
 <a class="brand" href="{{ '/' | relative_url }}" aria-label="网络访问稳定性指南，返回首页"><img src="{{ '/assets/images/favicon.svg' | relative_url }}" alt="" width="40" height="40"><span class="brand-copy"><strong>网络稳定指南</strong><small>看清问题，再找方法</small></span></a>
 <nav class="primary-nav" aria-label="主导航"><a href="{{ '/' | relative_url }}">首页</a><a href="{{ '/#problems' | relative_url }}">问题指南</a><a href="{{ '/guide/network-tool-for-beginners/' | relative_url }}">工具入门</a><a href="{{ '/review/juechen-accelerator-faq/' | relative_url }}">绝尘使用</a><a class="nav-cta" href="https://ximenshu.github.io/vpn-selection-guide/" target="_blank" rel="noopener noreferrer">VPN 怎么选 <span aria-hidden="true">↗</span></a></nav>
</div></header>
<main class="page{% if page.url == '/' %} home-page{% endif %}" id="main-content">{{ content }}</main>

</body></html>
