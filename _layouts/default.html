<!doctype html>
<html lang="zh-CN">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-D2NJELDR3X"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-D2NJELDR3X');
  </script>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google-site-verification" content="o5L7XSaaQ47cSW0MYdBlAvXkc1hf6uQMmIffhdxhEzU">
  <meta name="msvalidate.01" content="72D1368100F04E271E3EC2CC04D06B2D">

  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  {% if page.robots %}<meta name="robots" content="{{ page.robots }}">{% endif %}

  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:type" content="{{ page.og_type | default: 'article' }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title | escape }}">
  <meta property="og:locale" content="zh_CN">
  {% if page.og_image %}<meta property="og:image" content="{{ page.og_image | absolute_url }}">{% endif %}

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": {{ page.schema_type | default: "WebPage" | jsonify }},
    "name": {{ page.title | default: site.title | jsonify }},
    {% if page.schema_type == "Article" %}"headline": {{ page.heading | default: page.title | jsonify }},{% endif %}
    "description": {{ page.description | default: site.description | jsonify }},
    "url": {{ page.url | absolute_url | jsonify }},
    "inLanguage": "zh-CN"{% if page.date_modified or page.schema_type != "WebSite" %},{% endif %}
    {% if page.date_modified %}"dateModified": {{ page.date_modified | jsonify }}{% if page.schema_type != "WebSite" %},{% endif %}{% endif %}
    {% if page.schema_type != "WebSite" %}"isPartOf": {
      "@type": "WebSite",
      "name": {{ site.title | jsonify }},
      "url": {{ "/" | absolute_url | jsonify }}
    }{% if page.schema_type == "Article" %},{% endif %}{% endif %}
    {% if page.schema_type == "Article" %}"mainEntityOfPage": {
      "@type": "WebPage",
      "@id": {{ page.url | absolute_url | jsonify }}
    }{% endif %}
  }
  </script>

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav aria-label="主导航">
      <a href="{{ '/' | relative_url }}">首页</a>
      <a href="{{ '/#problems' | relative_url }}">问题导航</a>
      <a href="{{ '/guide/network-tool-for-beginners/' | relative_url }}">网络工具</a>
      <a href="{{ '/review/juechen-accelerator-scenarios/' | relative_url }}">绝尘加速器</a>
      <a href="{{ '/about/' | relative_url }}">关于</a>
    </nav>
  </header>

  <main class="page">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p><strong>{{ site.title }}</strong>：先判断问题，再测试原因，最后决定是否需要网络工具。</p>
      <p><a href="{{ '/about/' | relative_url }}">网站用途与内容原则</a> · <a href="{{ '/' | relative_url }}">问题导航</a></p>
      <p>本站为第三方信息整理站，不代表文中提及的软件、平台或服务。涉及产品功能、政策和兼容性时，以对应官方当前说明为准；请遵守所在地法律法规及相关平台规则。</p>
    </div>
  </footer>
</body>
</html>
