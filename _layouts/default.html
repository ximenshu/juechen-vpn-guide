<!doctype html>
<html lang="zh-CN">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-D2NJELDR3X"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-D2NJELDR3X');
  </script>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="google-site-verification" content="o5L7XSaaQ47cSW0MYdBlAvXkc1hf6uQMmIffhdxhEzU">
  <meta name="msvalidate.01" content="72D1368100F04E271E3EC2CC04D06B2D">

  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  {% if page.robots %}
  <meta name="robots" content="{{ page.robots }}">
  {% endif %}

  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:type" content="{{ page.og_type | default: 'article' }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title | escape }}">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": {{ page.schema_type | default: "WebPage" | jsonify }},
    "name": {{ page.title | default: site.title | jsonify }},
    "description": {{ page.description | default: site.description | jsonify }},
    "url": {{ page.url | absolute_url | jsonify }},
    "inLanguage": "zh-CN",
    "isPartOf": {
      "@type": "WebSite",
      "name": {{ site.title | jsonify }},
      "url": {{ "/" | absolute_url | jsonify }}
    }
  }
  </script>

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>

    <nav aria-label="主导航">
      <a href="{{ '/' | relative_url }}">首页</a>
      <a href="{{ '/guide/streaming-buffering-fix/' | relative_url }}">流媒体</a>
      <a href="{{ '/guide/game-latency-guide/' | relative_url }}">游戏</a>
      <a href="{{ '/guide/remote-work-network/' | relative_url }}">远程办公</a>
      <a href="{{ '/guide/public-wifi-safety/' | relative_url }}">公共网络</a>
      <a href="{{ '/guide/multi-device-network-tool/' | relative_url }}">多设备</a>
      <a href="{{ '/review/juechen-accelerator-scenarios/' | relative_url }}">绝尘加速器</a>
    </nav>
  </header>

  <main class="page">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>本站整理网络加速和访问稳定性相关知识。请根据所在地法律法规、平台规则和个人实际需求合规使用相关工具。</p>
  </footer>
</body>
</html>
